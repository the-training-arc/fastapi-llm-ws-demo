[project]
name = "healf-llm-backend-ws-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12,<4.0"

dependencies = [
    "boto3==1.42.74",
    "fastapi[standard]==0.135.2",
    "instructor==1.14.5",
    "websockets==16.0",
    "anthropic[bedrock]==0.86.0",
    "pydantic==2.12.5",
    "pydantic-core==2.42.0",
    "structlog==25.5.0",
]

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "pre-commit==4.5.1",
    "ruff==0.15.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"
docstring-code-line-length = "dynamic"
indent-style = "space"
docstring-code-format = false
line-ending = "auto"


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
